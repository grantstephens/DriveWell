AutoUpdateMode: Version
# UpdateCheckMode: Tags would make `fdroid checkupdates` look for a
# committed AndroidManifest.xml per tag to read versionCode/versionName
# from, but android/ is generated by `expo prebuild` mid-recipe, never
# committed, so no tag ever has one and checkupdates hard-fails. The fix is
# UpdateCheckData pointed at fdroid-version.txt - a small file this repo's
# own `make prepare-release` writes and commits before every tag, carrying
# the exact versionCode release.yml computes (tools/compute-version.sh is
# the single source of truth both share). The filever "." means "reuse the
# same file's content for the versionName regex too".
UpdateCheckMode: Tags
# Derives each ABI split's versionCode from the raw one fdroid-version.txt
# carries - * 10 + 1 for armeabi-v7a, + 2 for arm64-v8a, matching the two
# Builds entries above in the same order. CurrentVersionCode must be the
# max of these once set.
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
UpdateCheckData: fdroid-version.txt|versionCode=([0-9]+)|.|versionName=(.+)
# TODO: set both once the first release is published (CurrentVersionCode =
# base versionCode * 10 + 2, the max of the two split codes).
