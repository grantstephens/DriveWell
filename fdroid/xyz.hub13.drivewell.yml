# Builds: one entry per ABI (armeabi-v7a and arm64-v8a only, skipping the
# emulator-only x86/x86_64 pair) instead of a single universal APK, per
# https://f-droid.org/en/docs/Submitting_to_F-Droid_Quick_Start_Guide/#setup-abi-split.
# versionCode is base * 10 + 1/+2 (VercodeOperation below), matching the
# doc's required v7a < v8a ordering and release.yml's per-ABI split builds.
# output: + a custom build: block instead of gradle: yes, because this is a
# pure Expo managed-workflow repo: android/ is generated fresh by
# `expo prebuild` and never committed, so `subdir: android/app` + `gradle:
# yes` would fail the pre-build directory-exists check.
#
# Reproducible build: binary: + AllowedAPKSigningKeys work by transplanting
# the reference binary's signature onto F-Droid's own from-source build and
# checking it still verifies (apksigcopier) - which only succeeds if the
# two are byte-identical. That needs, on top of the repo's own
# plugins/reproducible-builds.gradle (installed into the generated android/
# tree by the config plugin on every prebuild, mapping
# GRADLE_USER_HOME/repo-root out of __FILE__ and llvm-stripping
# .note.gnu.build-id from every merged .so):
#   - the same sed-based version injection release.yml uses (inserting
#     versionCode right after "android": {, not wherever JSON round-trip
#     ordering puts it);
#   - the buildFromSource autolinking insert (F-Droid's scanner policy
#     disallows prebuilt binaries, so both sides must compile native
#     modules from source, not consume prebuilt AARs);
#   - the JDK 21 retarget (RN's gradle-plugin hardcodes a JDK 17 toolchain,
#     conflicting with the buildserver's OpenJDK 21);
#   - deleting the signingConfig line (never let Gradle sign: the
#     comparison needs the unsigned output byte-identical, and signing must
#     happen after normalization or it invalidates the signature);
#   - -PreactNativeDevServerIp=localhost (otherwise the gradle-plugin bakes
#     the build machine's own LAN IP into resources.arsc, and every machine
#     embeds a different address);
#   - the postbuild zipalign normalization below (apksigcopier's signature
#     transplant requires both APKs' local-entry regions at the same byte
#     length - both sides must apply the identical normalization, same tool
#     and tag).
#
